[project]
name = "sdf-toolkit"
dynamic = ["version"]
description = "Python library for working Standard Delay Format (SDF) Timing Annotation files."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kelvin Chung" },
    { name = "F4PGA Authors", email = "f4pga-wg@lists.chipsalliance.org" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "lark[interegular]",
    "typer>=0.24.1",
    "rich>=14.3.3",
    "networkx",
    "graphviz>=0.21",
]

[project.scripts]
sdf-toolkit = "sdf_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/KelvinChung2000/sdf-toolkit"

[project.optional-dependencies]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/sdf_toolkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "AUTHORS"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit", "ty>=0.0.18"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
addopts = ["--doctest-modules"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/", "tests/"]
